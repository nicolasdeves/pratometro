name: deploy production

# Só existe production: todo push na main builda as três imagens e, se TODAS
# publicarem, atualiza o newTag dos overlays no nedev-gitops. O ArgoCD sincroniza
# sozinho; o Job de migrate roda como hook antes dos apps subirem.
on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io/nicolasdeves/pratometro

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.v.outputs.tag }}
    steps:
      - id: v
        run: echo "tag=${GITHUB_REF_NAME}-$(date -u +%Y%m%d-%H%M%S)" >> "$GITHUB_OUTPUT"

  build:
    needs: version
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - app: api
            dockerfile: apps/api/Dockerfile
          - app: web
            dockerfile: apps/web/Dockerfile
          - app: migrate
            dockerfile: tools/migrate/Dockerfile

    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ matrix.app }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ matrix.app }}:${{ needs.version.outputs.tag }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}
          provenance: false

  promote:
    # Tudo-ou-nada: só promove com TODAS as imagens publicadas.
    needs: [version, build]
    runs-on: ubuntu-latest

    steps:
      - name: atualiza production no nedev-gitops
        env:
          VERSION: ${{ needs.version.outputs.tag }}
          GITOPS_TOKEN: ${{ secrets.NEDEV_GITOPS_TOKEN }}
        run: |
          set -e
          [ -n "$GITOPS_TOKEN" ] || { echo 'secret NEDEV_GITOPS_TOKEN ausente'; exit 1; }
          git clone --depth 1 "https://x-access-token:${GITOPS_TOKEN}@github.com/nicolasdeves/nedev-gitops.git" nedev-gitops
          cd nedev-gitops
          for DIR in pratometro/apps/api pratometro/apps/web pratometro/tools/migrate; do
            sed -i -E "s|^(    newTag: ).*|\1$VERSION|; s|^(      - version=).*|\1$VERSION|" "$DIR/overlays/production/kustomization.yaml"
          done
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && echo 'sem mudança' && exit 0
          git commit -m "production(pratometro): $VERSION"
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            echo "tentativa $i falhou, repetindo"
            sleep $((RANDOM % 5 + 1))
          done
          exit 1

      - run: echo "### production(pratometro) → ${{ needs.version.outputs.tag }}" >> "$GITHUB_STEP_SUMMARY"
